<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laporan Penjualan - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-reports">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 flex flex-col justify-between gap-4 rounded-2xl bg-amber-50 px-5 py-7 sm:flex-row sm:items-end sm:px-8">
            <div><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Laporan penjualan</h1><p class="mt-2 text-sm text-slate-600">Ringkasan omzet dari transaksi yang dibayar dan tidak dibatalkan.</p></div>
            <div class="flex flex-wrap gap-2">
                <label class="text-xs font-bold text-slate-600">Periode<select id="reportRange" class="mt-1 block min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800"><option value="7">7 hari terakhir</option><option value="30">30 hari terakhir</option><option value="Semua">Semua waktu</option></select></label>
                <label class="text-xs font-bold text-slate-600">Toko<select id="reportSeller" class="mt-1 block min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800"></select></label>
            </div>
        </header>
        <section id="reportStats" class="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="Ringkasan laporan"></section>
        <section class="mt-6 grid gap-6 lg:grid-cols-[1.4fr_.9fr]">
            <article class="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <div class="flex flex-wrap items-start justify-between gap-3"><div><h2 class="font-heading text-lg font-extrabold text-slate-900">Penjualan per toko</h2><p id="reportSubtitle" class="mt-1 text-sm text-slate-500"></p></div><button id="exportReport" class="rounded-lg bg-teal-700 px-4 py-2 text-xs font-bold text-white transition hover:bg-teal-800">Ekspor CSV</button></div>
                <div class="mt-5 overflow-x-auto"><table class="w-full min-w-[620px] text-left text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-4 py-3">Toko</th><th class="px-4 py-3">Pesanan</th><th class="px-4 py-3">Item terjual</th><th class="px-4 py-3">Omzet</th><th class="px-4 py-3">Bagian</th></tr></thead><tbody id="reportRows" class="divide-y divide-slate-100"></tbody></table></div>
            </article>
            <article class="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><h2 class="font-heading text-lg font-extrabold text-slate-900">Komposisi omzet</h2><p class="mt-1 text-sm text-slate-500">Perbandingan kontribusi tiap toko.</p><div id="reportChart" class="mt-5 space-y-4"></div></article>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-reports.js"></script>
</body>
</html>
