<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="border-b border-slate-200 bg-amber-50 px-5 py-8 sm:px-8"><p class="text-xs font-bold text-slate-500">Keranjang <span class="mx-1">/</span> Checkout</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Checkout</h1></header>
        <section class="py-8">
            <div id="checkoutEmpty" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center">
                <h2 class="font-heading text-xl font-bold text-slate-900">Tidak ada produk untuk checkout</h2><a class="mt-5 inline-flex rounded-lg bg-teal-700 px-5 py-3 font-bold text-white" href="products.html">Lihat Produk</a>
            </div>
            <div id="checkoutLayout" class="hidden grid grid-cols-1 gap-7 lg:grid-cols-[1fr_360px]">
                <form id="checkoutForm" class="space-y-4">
                    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
                        <h2 class="font-heading text-lg font-extrabold text-slate-900">Informasi Penerima</h2>
                        <div class="mt-5 grid gap-4 sm:grid-cols-2">
                            <label class="text-xs font-bold text-slate-600">Nama penerima<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800" name="name" required></label>
                            <label class="text-xs font-bold text-slate-600">Nomor telepon<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800" name="phone" required></label>
                            <label class="text-xs font-bold text-slate-600 sm:col-span-2">Alamat pengiriman<textarea class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal text-slate-800" name="address" rows="3" required></textarea></label>
                            <label class="text-xs font-bold text-slate-600 sm:col-span-2">Catatan untuk penjual<textarea class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal text-slate-800" name="note" rows="2" placeholder="Contoh: kirim sebelum sore"></textarea></label>
                        </div>
                    </section>
                    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
                        <h2 class="font-heading text-lg font-extrabold text-slate-900">Metode Pembayaran</h2>
                        <div class="mt-4 grid gap-3">
                            <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-4 has-[:checked]:border-teal-700 has-[:checked]:bg-teal-50"><input type="radio" name="payment" value="Transfer Bank" checked>Transfer Bank (simulasi)</label>
                            <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-4 has-[:checked]:border-teal-700 has-[:checked]:bg-teal-50"><input type="radio" name="payment" value="E-Wallet">E-Wallet (simulasi)</label>
                            <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-4 has-[:checked]:border-teal-700 has-[:checked]:bg-teal-50"><input type="radio" name="payment" value="COD">COD (Bayar di tempat)</label>
                        </div>
                    </section>
                </form>
                <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:sticky lg:top-24">
                    <h2 class="font-heading text-lg font-extrabold text-slate-900">Ringkasan Pesanan</h2>
                    <div id="checkoutItems" class="mt-4 space-y-3"></div>
                    <div class="mt-4 flex justify-between border-t border-slate-100 pt-4 text-sm"><span class="text-slate-500">Subtotal</span><strong id="checkoutSubtotal"></strong></div>
                    <div class="mt-3 flex justify-between gap-3 text-sm"><span class="text-slate-500">Pengiriman</span><strong id="checkoutShipping"></strong></div><p id="checkoutShippingNote" class="mt-1 text-right text-xs text-slate-500"></p>
                    <div class="mt-4 flex justify-between border-t border-slate-200 pt-4 text-lg font-extrabold text-slate-900"><span>Total</span><span id="checkoutTotal"></span></div>
                    <button class="mt-5 w-full rounded-lg bg-teal-700 px-4 py-3 font-bold text-white transition hover:bg-teal-800" id="confirmOrder" type="button">Konfirmasi Pesanan</button>
                </aside>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/checkout.js"></script>
</body>
</html>
