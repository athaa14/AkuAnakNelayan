<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verifikasi Penjual - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-sellers">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8">
            <p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p>
            <h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Verifikasi penjual</h1>
            <p class="mt-2 text-sm text-slate-600">Pantau toko terdaftar dan status verifikasinya.</p>
        </header>
        <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div class="grid gap-3 sm:grid-cols-2">
                <label class="text-xs font-bold text-slate-600">Cari toko atau pemilik
                    <input id="sellerSearch" type="search" placeholder="Nama toko atau pemilik" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-normal text-slate-800">
                </label>
                <label class="text-xs font-bold text-slate-600">Status verifikasi
                    <select id="verifyFilter" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800">
                        <option value="Semua">Semua status</option><option value="Terverifikasi">Terverifikasi</option><option value="Menunggu">Menunggu verifikasi</option>
                    </select>
                </label>
            </div>
            <div id="sellersEmpty" class="mt-6 hidden rounded-xl border border-dashed border-slate-300 px-4 py-10 text-center text-sm text-slate-500">Tidak ada toko yang cocok.</div>
            <div id="sellerTableWrap" class="mt-6 overflow-x-auto">
                <table class="w-full min-w-[760px] text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-4 py-3">Toko</th><th class="px-4 py-3">Pemilik</th><th class="px-4 py-3">Lokasi</th><th class="px-4 py-3">Produk</th><th class="px-4 py-3">Rating</th><th class="px-4 py-3">Verifikasi</th><th class="px-4 py-3">Aksi</th></tr></thead>
                    <tbody id="sellerRows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-sellers.js"></script>
</body>
</html>
