<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Keranjang - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="border-b border-slate-200 bg-amber-50 px-5 py-8 sm:px-8"><p class="text-xs font-bold text-slate-500">Beranda <span class="mx-1">/</span> Keranjang</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Keranjang Belanja</h1></header>
        <section class="py-8">
            <div id="cartLayout" class="hidden grid grid-cols-1 gap-7 lg:grid-cols-[1fr_360px]">
                <div id="cartItems" class="space-y-3"></div>
                <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:sticky lg:top-24">
                    <h2 class="font-heading text-lg font-extrabold text-slate-900">Ringkasan Belanja</h2>
                    <div class="mt-5 flex justify-between text-sm"><span class="text-slate-500">Subtotal</span><strong id="cartSubtotal"></strong></div>
                    <div class="mt-3 flex justify-between text-sm"><span class="text-slate-500">Estimasi pengiriman</span><strong>Rp10.000</strong></div>
                    <div class="mt-4 flex justify-between border-t border-slate-200 pt-4 text-lg font-extrabold text-slate-900"><span>Total</span><span id="cartTotal"></span></div>
                    <button class="mt-5 w-full rounded-lg bg-teal-700 px-4 py-3 font-bold text-white transition hover:bg-teal-800" id="checkoutBtn">Lanjut ke Checkout</button>
                </aside>
            </div>
            <div id="cartEmpty" class="hidden rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center">
                <i class="mx-auto h-10 w-10 text-slate-400" data-lucide="shopping-cart"></i><h2 class="mt-4 font-heading text-xl font-bold text-slate-900">Keranjang masih kosong</h2>
                <p class="mt-2 text-sm text-slate-500">Tambahkan hasil laut dari halaman produk.</p><a class="mt-5 inline-flex rounded-lg bg-teal-700 px-5 py-3 font-bold text-white" href="products.html">Lihat Produk</a>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/cart.js"></script>
</body>
</html>
