<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konten Website - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-content">
    <main class="mx-auto w-full max-w-5xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8">
            <p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p>
            <h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Konten website</h1>
            <p class="mt-2 text-sm text-slate-600">Ubah teks hero beranda dan isi halaman bantuan, tentang, privasi, syarat, pengiriman, serta kontak.</p>
        </header>
        <form id="contentForm" class="mt-6 space-y-6">
            <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <h2 class="font-heading text-lg font-extrabold text-slate-900">Hero beranda</h2>
                <div class="mt-4 grid gap-4">
                    <label class="text-xs font-bold text-slate-600">Label atas<input name="heroEyebrow" required class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800"></label>
                    <label class="text-xs font-bold text-slate-600">Judul utama<input name="heroTitle" required class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800"></label>
                    <label class="text-xs font-bold text-slate-600">Deskripsi<textarea name="heroDescription" rows="3" required class="mt-1 block w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal text-slate-800"></textarea></label>
                    <label class="text-xs font-bold text-slate-600">URL gambar hero<input name="heroImage" required class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800"></label>
                </div>
            </section>
            <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <h2 class="font-heading text-lg font-extrabold text-slate-900">Halaman statis</h2>
                <p class="mt-1 text-sm text-slate-500">Gunakan enter untuk memisahkan paragraf.</p>
                <div id="pageFields" class="mt-5 space-y-6"></div>
            </section>
            <p id="contentError" class="text-sm font-semibold text-rose-700"></p>
            <div class="flex justify-end"><button class="rounded-lg bg-teal-700 px-6 py-2.5 text-sm font-bold text-white transition hover:bg-teal-800" type="submit">Simpan konten</button></div>
        </form>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-content.js"></script>
</body>
</html>
