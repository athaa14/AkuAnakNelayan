<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dasbor Penjual - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-seller-active="seller-dashboard">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 flex flex-col justify-between gap-4 rounded-2xl bg-amber-50 px-5 py-7 sm:flex-row sm:items-end sm:px-8">
            <div><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Ringkasan toko</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Dasbor penjual</h1><p class="mt-2 text-sm text-slate-600" id="dashboardDate"></p></div>
            <label class="text-xs font-bold text-slate-600">Periode laporan
                <select id="salesRange" class="mt-1 block min-h-10 rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800">
                    <option value="7">7 hari terakhir</option><option value="30">30 hari terakhir</option>
                </select>
            </label>
        </header>
        <section id="sellerStats" class="mt-6 grid gap-3 sm:grid-cols-2 lg:grid-cols-4" aria-label="Statistik toko"></section>
        <section class="mt-6 grid gap-6 lg:grid-cols-[1.4fr_.9fr]">
            <article class="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <div class="flex flex-wrap items-start justify-between gap-3"><div><h2 class="font-heading text-lg font-extrabold text-slate-900">Tren penjualan</h2><p class="mt-1 text-sm text-slate-500" id="chartSubtitle"></p></div><strong class="text-sm text-slate-700" id="chartTotal"></strong></div>
                <div class="mt-5 overflow-x-auto" id="salesChart"></div>
            </article>
            <article class="min-w-0 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                <div class="flex items-start justify-between gap-3"><div><h2 class="font-heading text-lg font-extrabold text-slate-900">Perlu restok</h2><p class="mt-1 text-sm text-slate-500">Stok ≤ 5 kg atau sudah habis</p></div><a class="shrink-0 text-sm font-bold text-teal-700 hover:text-teal-900" href="seller-products.html">Kelola</a></div>
                <div class="mt-4 divide-y divide-slate-100" id="lowStockList"></div>
            </article>
        </section>
        <section class="mb-10 mt-6 rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 px-5 py-5 sm:px-6"><div><h2 class="font-heading text-lg font-extrabold text-slate-900">Transaksi terbaru</h2><p class="mt-1 text-sm text-slate-500">Pesanan yang perlu dipantau dan riwayat penjualan toko.</p></div><a class="text-sm font-bold text-teal-700 hover:text-teal-900" href="seller-orders.html">Semua transaksi</a></div>
            <div class="overflow-x-auto"><table class="w-full min-w-[760px] text-left text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-3">Pesanan</th><th class="px-5 py-3">Tanggal</th><th class="px-5 py-3">Produk</th><th class="px-5 py-3">Nilai toko</th><th class="px-5 py-3">Status</th><th class="px-5 py-3"></th></tr></thead><tbody id="recentOrders" class="divide-y divide-slate-100"></tbody></table></div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/seller-common.js"></script><script src="assets/js/seller-dashboard.js"></script>
</body>
</html>
