<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Produk - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-seller-active="seller-products">
    <main class="mx-auto w-full max-w-4xl flex-1 px-4 sm:px-6">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8"><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Inventaris toko</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900" id="productFormHeading">Tambah produk</h1><p class="mt-2 text-sm text-slate-600">Informasi yang jelas membantu pembeli memilih hasil tangkapan Anda.</p></header>
        <form id="sellerProductForm" class="my-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Nama produk<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="name" required maxlength="80"></label>
                <label class="text-xs font-bold text-slate-600">Kategori<select class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-normal" name="category" required><option value="">Pilih kategori</option><option>Ikan</option><option>Udang</option><option>Cumi-cumi</option><option>Kepiting</option><option>Kerang</option><option>Hasil Laut Lainnya</option></select></label>
                <label class="text-xs font-bold text-slate-600">Harga per kg (Rp)<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="price" type="number" min="1" step="1" required></label>
                <label class="text-xs font-bold text-slate-600">Stok<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="stock" type="number" min="0" step="0.1" required></label>
                <label class="text-xs font-bold text-slate-600">Satuan<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 text-sm font-normal" name="stockUnit" value="kg" readonly></label>
                <label class="text-xs font-bold text-slate-600">Status kesegaran<select class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-normal" name="freshness" required><option>Sangat Segar</option><option>Segar</option><option>Perlu Segera Diolah</option></select></label>
                <label class="text-xs font-bold text-slate-600">Tanggal tangkapan<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="catchDate" type="date" required></label>
                <label class="text-xs font-bold text-slate-600">Waktu tangkapan<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="catchTime" type="time" required></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Lokasi tangkapan<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="catchLocation" placeholder="Contoh: Perairan Pangandaran" required></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">URL foto utama<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="image" type="url" placeholder="https://..." required></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">URL dokumentasi tambahan <span class="font-normal text-slate-400">(satu URL per baris, opsional)</span><textarea class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal" name="proofImages" rows="3" placeholder="https://..."></textarea></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Deskripsi<textarea class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal" name="description" rows="4" required maxlength="600"></textarea></label>
                <label class="flex items-center gap-3 rounded-xl bg-slate-50 p-4 text-sm font-semibold text-slate-700 sm:col-span-2"><input name="isPublished" type="checkbox" checked class="h-4 w-4 accent-teal-700">Tampilkan produk ini di marketplace</label>
            </div>
            <p id="productFormError" class="mt-4 min-h-5 text-sm font-medium text-rose-600" role="alert"></p>
            <div class="mt-3 flex flex-wrap justify-end gap-3"><a class="rounded-lg border border-slate-300 px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50" href="seller-products.html">Batal</a><button class="rounded-lg bg-teal-700 px-5 py-3 text-sm font-bold text-white hover:bg-teal-800" type="submit">Simpan produk</button></div>
        </form>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/seller-common.js"></script><script src="assets/js/seller-product-form.js"></script>
</body>
</html>
