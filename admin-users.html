<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kelola Pengguna - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-users">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8">
            <p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p>
            <h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Kelola pengguna</h1>
            <p class="mt-2 text-sm text-slate-600">Atur role dan status akses seluruh akun marketplace.</p>
        </header>

        <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div class="grid gap-3 sm:grid-cols-3">
                <label class="text-xs font-bold text-slate-600">Cari
                    <input id="userSearch" type="search" placeholder="Nama atau email" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-normal text-slate-800">
                </label>
                <label class="text-xs font-bold text-slate-600">Role
                    <select id="roleFilter" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800">
                        <option value="Semua">Semua role</option><option value="buyer">Buyer</option><option value="seller">Seller</option><option value="admin">Admin</option>
                    </select>
                </label>
                <label class="text-xs font-bold text-slate-600">Status
                    <select id="statusFilter" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800">
                        <option value="Semua">Semua status</option><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option>
                    </select>
                </label>
            </div>

            <div id="usersEmpty" class="mt-6 hidden rounded-xl border border-dashed border-slate-300 px-4 py-10 text-center text-sm text-slate-500">Tidak ada pengguna yang cocok dengan pencarian.</div>
            <div id="userTableWrap" class="mt-6 overflow-x-auto">
                <table class="w-full min-w-[780px] text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
                        <tr><th class="px-4 py-3">Pengguna</th><th class="px-4 py-3">Role</th><th class="px-4 py-3">Toko</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Aksi</th></tr>
                    </thead>
                    <tbody id="userRows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="sellerModal" class="fixed inset-0 z-[80] hidden items-center justify-center bg-slate-900/50 px-4 py-8" role="dialog" aria-modal="true" aria-labelledby="sellerModalTitle">
        <form id="sellerForm" class="w-full max-w-lg rounded-2xl bg-white p-6 shadow-xl">
            <h2 id="sellerModalTitle" class="font-heading text-xl font-extrabold text-slate-900">Lengkapi profil toko</h2>
            <p class="mt-1 text-sm text-slate-500" id="sellerModalHint"></p>
            <div class="mt-5 grid gap-4">
                <label class="text-xs font-bold text-slate-600">Nama toko
                    <input name="shopName" required minlength="3" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800">
                </label>
                <label class="text-xs font-bold text-slate-600">Lokasi toko
                    <input name="location" required class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800">
                </label>
                <label class="text-xs font-bold text-slate-600">Deskripsi toko
                    <textarea name="description" required minlength="10" rows="3" class="mt-1 block w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal text-slate-800"></textarea>
                </label>
            </div>
            <div class="mt-6 flex justify-end gap-2">
                <button type="button" id="cancelSeller" class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-bold text-slate-600 transition hover:bg-slate-50">Batal</button>
                <button type="submit" class="rounded-lg bg-teal-700 px-4 py-2 text-sm font-bold text-white transition hover:bg-teal-800">Simpan sebagai Penjual</button>
            </div>
        </form>
    </div>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-users.js"></script>
</body>
</html>
