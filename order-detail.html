<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail Pesanan - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="border-b border-slate-200 bg-amber-50 px-5 py-8 sm:px-8"><p class="text-xs font-bold text-slate-500">Pesanan <span class="mx-1">/</span> Detail</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900" id="orderHeading">Detail Pesanan</h1></header>
        <section class="grid grid-cols-1 gap-6 py-8 lg:grid-cols-[1fr_360px]" id="orderDetail">
            <div class="space-y-4">
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
                    <div class="flex items-center justify-between gap-3"><h2 class="font-heading text-lg font-extrabold text-slate-900">Tracking Pesanan</h2><span id="orderStatus" class="rounded-full bg-teal-50 px-3 py-1 text-xs font-bold text-teal-700"></span></div>
                    <ol id="orderTimeline" class="mt-6 space-y-5"></ol>
                </article>
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7"><h2 class="font-heading text-lg font-extrabold text-slate-900">Produk Pesanan</h2><div id="orderItems" class="mt-4 divide-y divide-slate-100"></div></article>
                <article id="reviewCard" class="hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
                    <h2 class="font-heading text-lg font-extrabold text-slate-900">Beri ulasan</h2>
                    <div class="mt-4 grid gap-4 sm:grid-cols-2">
                        <label class="text-xs font-bold text-slate-600">Rating<select id="reviewRating" class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-normal"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>
                        <label class="text-xs font-bold text-slate-600 sm:col-span-2">Komentar<textarea id="reviewComment" class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal" rows="3" placeholder="Tulis pengalaman Anda"></textarea></label>
                    </div>
                    <button class="mt-4 rounded-lg bg-teal-700 px-5 py-3 font-bold text-white" id="submitReview">Kirim Ulasan</button>
                </article>
            </div>
            <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-5 shadow-sm lg:sticky lg:top-24">
                <h2 class="font-heading text-lg font-extrabold text-slate-900">Ringkasan</h2>
                <div class="mt-4 flex justify-between text-sm"><span class="text-slate-500">Total produk</span><strong id="orderSubtotal"></strong></div>
                <div class="mt-3 flex justify-between text-sm"><span class="text-slate-500">Pengiriman</span><strong id="orderShipping"></strong></div>
                <div class="mt-4 flex justify-between border-t border-slate-200 pt-4 text-lg font-extrabold text-slate-900"><span>Total</span><span id="orderTotal"></span></div>
                <div class="mt-4 border-t border-slate-100 pt-4 text-sm leading-6 text-slate-600"><strong class="text-slate-900">Alamat</strong><br><span id="orderAddress"></span><br><br><strong class="text-slate-900">Pembayaran</strong><br><span id="orderPayment"></span></div>
                <div class="mt-5 grid gap-2" id="orderActions"></div>
            </aside>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/order-detail.js"></script>
</body>
</html>
