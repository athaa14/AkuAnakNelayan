<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil Toko - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-seller-active="seller-profile">
    <main class="mx-auto w-full max-w-3xl flex-1 px-4 sm:px-6">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8"><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Informasi toko</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Profil penjual</h1><p class="mt-2 text-sm text-slate-600">Informasi ini ditampilkan kepada pembeli di marketplace.</p></header>
        <form id="sellerProfileForm" class="my-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
            <div class="mb-6 flex items-center gap-4"><img id="sellerProfilePreview" class="h-16 w-16 rounded-full border border-slate-200 object-cover" alt=""><div><h2 class="font-heading text-lg font-extrabold text-slate-900" id="sellerProfileShopName"></h2><p class="mt-1 text-sm text-slate-500" id="sellerProfileEmail"></p></div></div>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Nama toko<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="shopName" required maxlength="80"></label>
                <label class="text-xs font-bold text-slate-600">Nama pemilik<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="ownerName" required maxlength="80"></label>
                <label class="text-xs font-bold text-slate-600">Nomor telepon<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="phone" required></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Lokasi<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="location" required maxlength="120"></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Deskripsi toko<textarea class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm font-normal" name="description" rows="4" maxlength="400"></textarea></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">URL foto profil toko<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal" name="image" type="url" required></label>
                <label class="text-xs font-bold text-slate-600 sm:col-span-2">Email akun<input class="mt-1.5 min-h-11 w-full rounded-lg border border-slate-200 bg-slate-50 px-3 text-sm font-normal text-slate-500" id="sellerProfileEmailInput" type="email" disabled></label>
            </div>
            <p id="sellerProfileError" class="mt-4 min-h-5 text-sm font-medium text-rose-600" role="alert"></p>
            <div class="mt-3 flex justify-end"><button class="rounded-lg bg-teal-700 px-5 py-3 text-sm font-bold text-white hover:bg-teal-800" type="submit">Simpan profil</button></div>
        </form>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/seller-common.js"></script><script src="assets/js/seller-profile.js"></script>
</body>
</html>
