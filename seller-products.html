<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produk Saya - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-seller-active="seller-products">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 flex flex-col justify-between gap-4 rounded-2xl bg-amber-50 px-5 py-7 sm:flex-row sm:items-end sm:px-8">
            <div><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Inventaris toko</p><h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Produk saya</h1><p class="mt-2 text-sm text-slate-600">Atur informasi produk dan stok yang tampil di marketplace.</p></div>
            <a class="inline-flex items-center justify-center gap-2 rounded-lg bg-teal-700 px-4 py-3 text-sm font-bold text-white transition hover:bg-teal-800" href="seller-product-form.html">Tambah produk</a>
        </header>
        <section class="mb-10 mt-6 rounded-2xl border border-slate-200 bg-white shadow-sm">
            <div class="flex flex-col gap-3 border-b border-slate-100 p-5 sm:flex-row sm:items-center sm:px-6">
                <label class="relative flex-1"><span class="sr-only">Cari nama produk</span><input id="productSearch" class="min-h-11 w-full rounded-lg border border-slate-200 px-3 pl-10 text-sm outline-none focus:border-teal-700" placeholder="Cari nama produk"><span class="absolute left-3 top-3 text-slate-400" data-lucide="search"></span></label>
                <label class="text-xs font-bold text-slate-600">Tampilkan
                    <select id="productFilter" class="ml-2 min-h-11 rounded-lg border border-slate-200 bg-white px-3 text-sm font-medium"><option value="all">Semua produk</option><option value="active">Aktif</option><option value="hidden">Disembunyikan</option><option value="low">Stok menipis/habis</option></select>
                </label>
                <a class="inline-flex min-h-11 shrink-0 items-center justify-center gap-2 rounded-lg bg-teal-700 px-4 text-sm font-bold text-white hover:bg-teal-800" href="seller-product-form.html">Tambah produk</a>
            </div>
            <div class="overflow-x-auto"><table class="w-full min-w-[850px] text-left text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-5 py-3">Produk</th><th class="px-5 py-3">Kategori</th><th class="px-5 py-3">Harga</th><th class="px-5 py-3">Stok</th><th class="px-5 py-3">Status</th><th class="px-5 py-3">Diperbarui</th><th class="px-5 py-3">Aksi</th></tr></thead><tbody id="sellerProductRows" class="divide-y divide-slate-100"></tbody></table></div>
            <div id="productEmpty" class="hidden px-6 py-16 text-center"><h2 class="font-heading text-lg font-bold text-slate-900">Produk belum tersedia</h2><p class="mt-2 text-sm text-slate-500">Tambahkan produk pertama ke toko Anda.</p><a class="mt-4 inline-flex rounded-lg bg-teal-700 px-4 py-2.5 text-sm font-bold text-white" href="seller-product-form.html">Tambah produk</a></div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/seller-common.js"></script><script src="assets/js/seller-products.js"></script>
</body>
</html>
