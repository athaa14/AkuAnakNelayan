<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail Transaksi Admin - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-orders">
    <main class="mx-auto w-full max-w-6xl flex-1 px-4 sm:px-6 lg:px-8">
        <div id="orderNotFound" class="mt-10 hidden rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center"><h1 class="font-heading text-xl font-bold text-slate-900">Transaksi tidak ditemukan</h1><a class="mt-4 inline-block font-bold text-teal-700" href="admin-orders.html">Kembali ke daftar transaksi</a></div>
        <div id="orderContent">
            <header class="mt-7 flex flex-col justify-between gap-4 rounded-2xl bg-amber-50 px-5 py-7 sm:flex-row sm:items-end sm:px-8">
                <div><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p><h1 id="orderHeading" class="mt-2 font-heading text-3xl font-extrabold text-slate-900"></h1><p id="orderDate" class="mt-2 text-sm text-slate-600"></p></div>
                <div id="orderStatus"></div>
            </header>
            <section class="mt-6 grid gap-6 lg:grid-cols-[1.4fr_.9fr]">
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
                    <h2 class="font-heading text-lg font-extrabold text-slate-900">Item pesanan</h2>
                    <div class="mt-4 overflow-x-auto"><table class="w-full min-w-[520px] text-left text-sm"><thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-3 py-3">Produk</th><th class="px-3 py-3">Jumlah</th><th class="px-3 py-3">Harga</th><th class="px-3 py-3">Subtotal</th></tr></thead><tbody id="orderItems" class="divide-y divide-slate-100"></tbody></table></div>
                    <div id="orderTotals" class="mt-4 space-y-2 border-t border-slate-200 pt-4 text-sm"></div>
                </article>
                <aside class="space-y-6">
                    <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><h2 class="font-heading text-lg font-extrabold text-slate-900">Informasi pesanan</h2><dl id="orderInfo" class="mt-4 space-y-3 text-sm"></dl></article>
                    <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><h2 class="font-heading text-lg font-extrabold text-slate-900">Aksi admin</h2><p class="mt-1 text-xs text-slate-500">Perubahan status mengikuti alur dan tercatat pada riwayat.</p><div class="mt-4 grid gap-2"><button id="confirmPayment" class="rounded-lg bg-teal-700 px-4 py-2.5 text-sm font-bold text-white transition hover:bg-teal-800 disabled:cursor-not-allowed disabled:bg-slate-300">Konfirmasi pembayaran</button><button id="cancelOrder" class="rounded-lg border border-rose-200 px-4 py-2.5 text-sm font-bold text-rose-700 transition hover:bg-rose-50 disabled:cursor-not-allowed disabled:border-slate-200 disabled:text-slate-400">Batalkan pesanan</button></div></article>
                </aside>
            </section>
            <section class="mb-10 mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><h2 class="font-heading text-lg font-extrabold text-slate-900">Riwayat status</h2><ol id="orderHistory" class="mt-4 space-y-3"></ol></section>
        </div>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-order-detail.js"></script>
</body>
</html>
