<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaksi Admin - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-orders">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8">
            <p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Area admin</p>
            <h1 class="mt-2 font-heading text-3xl font-extrabold text-slate-900">Semua transaksi</h1>
            <p class="mt-2 text-sm text-slate-600">Pantau pesanan dari seluruh toko dan status pemenuhannya.</p>
        </header>
        <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div class="grid gap-3 sm:grid-cols-3">
                <label class="text-xs font-bold text-slate-600">Cari pesanan atau pembeli<input id="orderSearch" type="search" placeholder="Contoh: ORD-001" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 px-3 text-sm font-normal text-slate-800"></label>
                <label class="text-xs font-bold text-slate-600">Toko<select id="sellerFilter" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800"></select></label>
                <label class="text-xs font-bold text-slate-600">Status<select id="statusFilter" class="mt-1 block min-h-10 w-full rounded-lg border border-slate-200 bg-white px-3 text-sm font-semibold text-slate-800"><option value="Semua">Semua status</option><option>Belum Dibayar</option><option>Dikemas</option><option>Dikirim</option><option>Dalam Perjalanan</option><option>Selesai</option><option>Dibatalkan</option></select></label>
            </div>
            <div id="ordersEmpty" class="mt-6 hidden rounded-xl border border-dashed border-slate-300 px-4 py-10 text-center text-sm text-slate-500">Tidak ada transaksi yang cocok.</div>
            <div id="orderTableWrap" class="mt-6 overflow-x-auto">
                <table class="w-full min-w-[900px] text-left text-sm">
                    <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500"><tr><th class="px-4 py-3">Pesanan</th><th class="px-4 py-3">Tanggal</th><th class="px-4 py-3">Pembeli</th><th class="px-4 py-3">Toko</th><th class="px-4 py-3">Produk</th><th class="px-4 py-3">Total</th><th class="px-4 py-3">Status</th><th class="px-4 py-3"></th></tr></thead>
                    <tbody id="orderRows" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-orders.js"></script>
</body>
</html>
