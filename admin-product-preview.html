<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pratinjau Produk - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800" data-admin-active="admin-products">
    <main class="mx-auto w-full max-w-6xl flex-1 px-4 sm:px-6 lg:px-8">
        <div id="previewNotFound" class="mt-10 hidden rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-16 text-center"><h1 class="font-heading text-xl font-bold text-slate-900">Produk tidak ditemukan</h1><a class="mt-4 inline-block font-bold text-teal-700" href="admin-products.html">Kembali ke moderasi produk</a></div>
        <div id="previewContent">
            <header class="mt-7 rounded-2xl bg-amber-50 px-5 py-7 sm:px-8"><p class="text-xs font-bold uppercase tracking-[.16em] text-teal-700">Pratinjau admin</p><h1 id="previewHeading" class="mt-2 font-heading text-3xl font-extrabold text-slate-900"></h1><p class="mt-2 text-sm text-slate-600">Tampilan ini membaca data mentah tanpa filter katalog publik.</p></header>
            <section class="mt-6 grid gap-6 lg:grid-cols-[1.1fr_.9fr]">
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><img id="previewImage" class="aspect-[4/3] w-full rounded-xl object-cover" src="" alt=""><div id="previewProofs" class="mt-3 grid grid-cols-4 gap-2"></div></article>
                <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"><dl id="previewInfo" class="space-y-3 text-sm"></dl></article>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-product-preview.js"></script>
</body>
</html>
