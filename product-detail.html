<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detail Produk - AkuAnakNelayan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen flex-col bg-slate-50 font-sans text-slate-800">
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 sm:px-6 lg:px-8">
        <div id="productNotFound" class="hidden py-20 text-center"><h1 class="font-heading text-2xl font-extrabold text-slate-900">Produk tidak ditemukan</h1><a class="mt-5 inline-flex rounded-lg bg-teal-700 px-5 py-3 font-bold text-white" href="products.html">Lihat Produk</a></div>
        <div id="productDetailContent">
            <p class="py-5 text-xs text-slate-500">Produk <span class="mx-1">/</span> <span id="detailBreadcrumb"></span></p>
            <section class="grid gap-8 pb-10 lg:grid-cols-2">
                <div>
                    <div class="overflow-hidden rounded-3xl bg-slate-100"><img id="mainDetailImage" class="h-72 w-full object-cover sm:h-[440px]" alt=""></div>
                    <div id="detailThumbs" class="mt-3 grid grid-cols-4 gap-3"></div>
                </div>
                <div class="py-2">
                    <span id="detailCategory" class="text-xs font-extrabold uppercase tracking-[.15em] text-teal-700"></span>
                    <h1 id="detailName" class="mt-2 font-heading text-3xl font-extrabold text-slate-900 sm:text-4xl"></h1>
                    <div class="mt-3 flex items-center gap-2 text-sm text-amber-600"><i data-lucide="star"></i><strong id="detailRating"></strong><span class="text-slate-300">|</span><span class="text-slate-500" id="detailSold"></span></div>
                    <div id="detailPrice" class="mt-5 font-heading text-3xl font-extrabold text-slate-900"></div>
                    <p id="stockNotice" class="mt-3 hidden rounded-lg bg-slate-100 p-3 text-sm font-bold text-slate-600">Produk ini sedang habis dan belum bisa dipesan.</p>
                    <p id="detailDescription" class="mt-4 leading-7 text-slate-600"></p>
                    <div class="mt-6 grid grid-cols-2 gap-3" id="detailInfo"></div>
                    <label class="mt-5 block text-xs font-bold text-slate-600" for="buyQty">Jumlah pembelian</label>
                    <div class="mt-2 flex h-11 w-36 items-center rounded-lg border border-slate-200 bg-white">
                        <button class="h-full w-11 text-lg" id="qtyMinus" aria-label="Kurangi jumlah">−</button><input class="w-14 text-center outline-none" id="buyQty" type="number" min="1" value="1"><button class="h-full w-11 text-lg" id="qtyPlus" aria-label="Tambah jumlah">+</button>
                    </div>
                    <div class="mt-5 grid gap-3 sm:grid-cols-2">
                        <button class="rounded-lg bg-teal-700 px-5 py-3 font-bold text-white transition hover:bg-teal-800 disabled:cursor-not-allowed disabled:opacity-50" id="buyNow">Beli Sekarang</button>
                        <button class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 font-bold text-slate-900 hover:border-teal-700 hover:text-teal-700" id="addCart"><i data-lucide="shopping-cart"></i>Keranjang</button>
                        <button class="inline-flex items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-3 font-bold text-slate-700 sm:col-span-2" id="detailWishlist"><i data-lucide="heart"></i><span>Tambahkan ke Favorit</span></button>
                    </div>
                </div>
            </section>
            <section class="grid gap-6 pb-12 lg:grid-cols-[1fr_320px]">
                <div class="space-y-4">
                    <article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-7"><h2 class="font-heading text-xl font-extrabold text-slate-900">Dokumentasi hasil tangkapan</h2><p class="mt-2 text-sm text-slate-500">Dokumentasi pendukung yang diunggah penjual dan belum diverifikasi independen.</p><div id="proofGrid" class="mt-5 grid gap-3 sm:grid-cols-3"></div></article>
                    <article class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-7"><h2 class="font-heading text-xl font-extrabold text-slate-900">Ulasan pembeli</h2><div id="reviewsList" class="mt-4 divide-y divide-slate-100"></div></article>
                </div>
                <aside class="h-fit rounded-2xl border border-slate-200 bg-white p-6 text-center transition hover:border-teal-300 hover:shadow-md">
                    <a id="sellerProfileLink" class="group block rounded-xl focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-700" href="products.html">
                        <img id="sellerImage" class="mx-auto h-20 w-20 rounded-full object-cover" alt="">
                        <h2 id="sellerName" class="mt-4 font-heading text-lg font-extrabold text-slate-900 group-hover:text-teal-700"></h2>
                        <div class="mt-2 flex justify-center gap-1 text-sm font-bold text-amber-600"><i data-lucide="star"></i><span id="sellerRating"></span></div>
                        <p id="sellerLocation" class="mt-2 text-sm text-slate-500"></p>
                        <p id="sellerDescription" class="mt-3 text-sm leading-6 text-slate-600"></p>
                        <span class="mt-5 inline-flex items-center gap-2 rounded-lg border border-slate-300 px-4 py-3 text-sm font-bold text-slate-900 transition group-hover:border-teal-700 group-hover:text-teal-700">Lihat produk nelayan <i data-lucide="arrow-right" class="h-4 w-4"></i></span>
                    </a>
                </aside>
            </section>
        </div>
    </main>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="assets/js/data.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/auth.js"></script>
    <script src="assets/js/shared.js"></script><script src="assets/js/detail.js"></script>
</body>
</html>
